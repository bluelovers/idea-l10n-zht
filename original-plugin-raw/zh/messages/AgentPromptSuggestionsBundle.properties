manual.context.paste.image.title=图像
popup.suggestion.editor.explain.label=解释代码
popup.suggestion.editor.explain.prompt=解释所选代码及其调用方的使用方式。
popup.suggestion.editor.refactor.label=重构代码
popup.suggestion.editor.refactor.prompt=重构所选代码以提高可读性。请勿改变可观测的行为，保持相同的返回值、相同的异常、相同的副作用以及相同的线程处理。无法您确保某项转换的等价性，请跳过该转换并说明原因。请列出您应用的每项转换。
popup.suggestion.editor.review.label=审查代码
popup.suggestion.editor.review.prompt=检查所选代码是否存在 bug、边缘情况或缺失测试。
popup.suggestion.paths.duplication.label=查找重复项
popup.suggestion.paths.duplication.prompt=在这些文件中查找重复的逻辑、重叠的职责或几乎相同的结构。
popup.suggestion.paths.impact.label=映射影响
popup.suggestion.paths.impact.prompt=映射这些文件之间的依赖与调用关系；如果其中任何一项发生更改时，高亮显示可能的影响范围。
popup.suggestion.paths.summary.label=总结文件
popup.suggestion.paths.summary.prompt=总结这些文件的功能以及它们之间的相互关系。
popup.suggestion.tests.bisect.label=二分定位
popup.suggestion.tests.bisect.prompt=找到引入这些故障的提交。阅读失败的测试文件及其所运行的生产代码路径上的 `git log -p`；从差异而非提交信息中找出可疑之处。列出你认为最有可能的 1 到 3 个候选提交，并附上可能导致回归的差异区块。除非你实际运行过该修订版的测试，否则不要妄下断言。
popup.suggestion.tests.coverage.label=解释覆盖率
popup.suggestion.tests.coverage.prompt=解释这些测试涵盖哪些内容，验证哪些行为，以及忽略哪些行为。
popup.suggestion.tests.explain.label=解释失败原因
popup.suggestion.tests.explain.prompt=解释这些测试失败的原因以及导致失败的代码。请勿修改任何代码。
popup.suggestion.tests.extend.label=添加测试
popup.suggestion.tests.extend.prompt=在与所选测试相同的测试文件中添加测试，以覆盖相同被测单元中现有测试所遗漏的行为。对于每个新测试，请说明其填补的覆盖率空白。
popup.suggestion.tests.fix.label=修复故障
popup.suggestion.tests.fix.prompt=让失败的测试通过。首先，在会话视图中，针对每个失败的测试，指出 bug 是存在于生产代码还是测试代码中，并用一句话说明原因。然后，只修复您指出的那一侧。请勿弱化断言或删除测试用例。
popup.suggestion.tests.review.label=审核测试
popup.suggestion.tests.review.prompt=审核这些测试，检查是否存在脆弱的假设、薄弱的断言、隐藏的依赖项或可疑的通过情况。
popup.suggestion.vcs.followup.label=列出后续工作
popup.suggestion.vcs.followup.prompt=列出这些提交所隐含的后续工作、TODO 和未完成事项 - 尚未添加的测试、尚未清理的引用、留待以后处理的行为。
popup.suggestion.vcs.review.label=审查提交
popup.suggestion.vcs.review.prompt=审查所选提交是否存在风险、回归或遗漏的后续工作。
popup.suggestion.vcs.summary.label=总结提交
popup.suggestion.vcs.summary.prompt=按区域分组汇总这些提交中发生的变化；指出任何有风险或异常的地方。
