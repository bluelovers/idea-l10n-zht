aitoolkit.feed.empty.text=<h5>此处将显示 AI 智能体的跟踪信息</h5><p>AI Agents Debugger 插件将在本地跟踪您的 Koog 智能体的执行。无需更改代码。</p><p>启动您的<b><inline_content_element>运行</inline_content_element></b>运行配置。</p><p>包含智能体步骤和决策的跟踪信息将自动显示在此处。</p>
aitoolkit.feed.outdatedKoog.text=<h5>您的 Koog 版本似乎已过时</h5><p>请将 Koog 更新至 <b>0.5.2</b> 或更高版本，以启用对 AI Agents Debugger 的支持。</p><p>然后启动您的<b><inline_content_element>运行</inline_content_element></b>运行配置。</p>
