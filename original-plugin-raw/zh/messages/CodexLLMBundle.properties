chat.codex.chat.mode.description=Codex 是 OpenAI 开发的一款功能强大的编码智能体，它可以在您的 IDE 中与您协同工作，构建功能、修正 bug、审查代码和回答问题。
codex.acp.agent.confirm.install.byok=点击“安装并继续”后，将自动安装 Codex。安装受 <a href\={0}>Apache License, Version 2.0</a> 约束。您的数据将由外部服务提供商根据其条款进行处理。JetBrains 对您的输入处理、生成的输出或任何其他操作不承担任何责任。
codex.acp.agent.confirm.install.enterprise=要在 AI Assistant 中使用 Codex，Codex 将在您点击“安装并继续”后自动安装。<br>安装受 <a href\="{0}">Apache License, Version 2.0</a> 约束。安装完成后，您的数据可能会由外部提供商根据其条款进行处理。<br>在 AI Assistant 中进一步使用 Codex 受适用的 JetBrains 特殊许可条款的约束，具体取决于您是在<a href\="{1}">云端</a>还是<a href\="{2}">本地</a>使用 JetBrains IDE 服务。<br>使用 Codex 会消耗您的 JetBrains AI 点数，除非您已关联您在第三方供应商处的自有订阅或在 AI Assistant 设置中提供了个人令牌。
codex.acp.agent.confirm.install.jba=要在 AI Assistant 中使用 Codex，Codex 将在您点击“安装并继续”后自动安装。<br>安装受 <a href\="{0}">Apache License, Version 2.0</a> 约束。安装完成后，您的数据可能会由外部提供商根据其条款进行处理。<br>在 AI Assistant 中进一步使用 Codex 受 <a href\="{1}">JetBrains AI 服务条款</a>约束。<br>使用 Codex 会消耗您的JetBrains AI 配额中的点数，除非您已关联您在第三方供应商处的自有订阅或在 AI Assistant 设置中提供了个人令牌。
codex.acp.agent.confirm.install.message=要在 AI Assistant 中使用 Codex，Codex 将在您点击“安装并继续”后自动安装。<br>安装受 OpenAI 的<a href\="{0}">使用条款</a>约束。点击“安装并继续”，即表示您同意这些条款。在 AI Assistant 中进一步使用 Codex 受 <a href\="{1}">JetBrains AI 服务条款</a>约束。<br>使用 Codex 会消耗您的 JetBrains AI 配额中的点数，除非您已关联您在第三方供应商处的自有订阅或在 AI Assistant 设置中提供了个人令牌。
