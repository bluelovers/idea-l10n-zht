onboarding.evaluation.run.cloud.step.text=您可以通过 Cadence 插件在云端运行长时间运行的评估
onboarding.evaluation.run.step.header=<b>运行评估</b>
onboarding.evaluation.run.step.text=点击此处以开始新评估。
