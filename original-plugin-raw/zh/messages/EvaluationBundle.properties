onboarding.add.to.dataset.inputs.step.header=<b>审查输入并保存</b>
onboarding.add.to.dataset.inputs.step.text=快速核实下方的<b>输入 JSON 路径</b>，<b>预期输出 JSON 路径</b>和<b>预期输出</b>。<br>然后点击<b>添加</b>以保存跟踪信息。
onboarding.add.to.dataset.step.header=<b>添加到数据集</b>
onboarding.add.to.dataset.step.text=点击<b>新建数据集</b>以创建您的第一个数据集。
onboarding.create.config.form.step.header=<b>配置评估</b>
onboarding.create.config.form.step.text=选择<b>运行配置</b>，设置<b>名称</b>，然后选择<b>输入数据集</b>。<br>如有需要，请调整 <b>LLM-as-a-Judge 提示词</b>和<b>模型</b>。<br>然后点击<b>确定</b>确认配置。
onboarding.enter.dataset.name.step.header=<b>添加到数据集</b>
onboarding.enter.dataset.name.step.text=输入数据集<b>名称</b>。
onboarding.evaluation.plus.step.header=<b>创建配置</b>
onboarding.evaluation.plus.step.text=点击此处以创建新的评估配置。
