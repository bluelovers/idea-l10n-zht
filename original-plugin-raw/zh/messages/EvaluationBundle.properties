onboarding.intro.step.header=<b>欢迎使用 AI 评估</b>
onboarding.intro.step.text=我们将协助您创建第一个数据集，并针对该数据集对您的智能体进行评估。
onboarding.repeat.onboarding.step.header=<b>重复导览</b>
onboarding.repeat.onboarding.step.text=您随时可以点击此处重复本导览。祝评估过程顺利\!
onboarding.results.output.step.header=<b>审查输出</b>
onboarding.results.output.step.text=您可以在此处检查评估结果。
onboarding.select.dataset.step.header=<b>添加到数据集</b>
onboarding.select.dataset.step.text=选择要添加条目的数据集。您可以一次将跟踪信息添加到多个数据集。
onboarding.switch.to.datasets.step.header=<b>切换到数据集</b>
onboarding.switch.to.datasets.step.text=您的跟踪结果已添加到数据集。您随时可以在“数据集”标签页中找到您的条目。
onboarding.switch.to.evaluation.step.header=<b>切换到评估</b>
onboarding.switch.to.evaluation.step.text=这是“评估”标签页。您可以在此处针对数据集评估您的智能体。但首先，您需要为其创建运行配置。
