demo.gaps.description=<br>• 水平间距由 Cell.gap 方法管理。标签与其关联组件之间使用 RightGap.SMALL，否则使用中等间距(不存在此枚举值)。<br>• 可以使用 Panel.indent 添加左缩进。<br>• 对于两列模式，请使用 Panel.twoColumnsRow 或 RightGap.COLUMNS。<br>• 默认情况下没有垂直间距(组件之间存在最小间距)，可以使用 Row.topGap 和 Row.bottomGap 方法进行添加。此类间距应追加到 'related' 行(这样，即使带有间距的行被隐藏，剩余布局也不会被破坏)。请注意，某些元素(例如 Panel.group)可能会在其周围添加额外的空间
