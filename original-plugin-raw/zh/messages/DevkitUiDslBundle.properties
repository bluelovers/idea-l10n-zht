demo.basics.description=UI DSL 构建器逐行构建内容。每一行都由单元组成，行中的最后一个单元会占据所有剩余宽度。行具有布局属性(参见 RowLayout)，用于指定行中单元的布局策略。<br>构建器的结果是一个类似网格的结构(参见 GridLayout)，其中相邻的单元可以合并为一个单元。每个单元格都可以包含某个组件或子网格。
