kotlin.jupyter.table.output.cannot.parse.dataframe.error=无法显示 DataFrame，因为它以序列化格式表示时过大。请考虑在注册表中增大 'jupyter.notebook.json.maxStringLength' 的值，或者切换为 HTML 表示。要使用 HTML 呈现，请在 Kotlin Notebook 插件设置中禁用“原生呈现 DataFrame 表”选项。
kotlin.jupyter.table.output.notification.content.could.not.display.table.with.d.columns=无法显示包含 {0} 列的表。要使用 HTML 呈现，请在 Kotlin Notebook 插件设置中禁用“原生呈现 DataFrame 表”选项。
