action.PyProjectTomlSyncAction.text=使用 `pyproject.toml` 同步项目
intellij.python.pyproject.name=从 pyproject.toml 生成项目
intellij.python.pyproject.system.name=基于 `pyproject.toml` 的项目
pyproject.notification.configure=启用
pyproject.notification.content=从 pyproject.toml 文件派生工作区结构和依赖项。<br/>此模式将重写手动项目设置。请考虑先备份 .idea 目录。
pyproject.notification.dont.show.again=不再显示
pyproject.notification.title=检测到 Pyproject.toml 工作区
pyproject.preview.after=之后
pyproject.preview.current=之前
pyproject.preview.dependencies=依赖项
pyproject.preview.dependencies.content=项目之间的依赖关系会根据 <b>pyproject.toml</b> 声明自动解析。项目结构存储在 <b>.idea</b> 目录下的 <b>.iml</b> 文件中，并在每次同步时从 pyproject.toml 生成。
pyproject.preview.description=大型项目可以拆分为较小的部分(如后端、API 和共享代码)，使其更易于组织和维护。
pyproject.preview.enable=启用工作区
pyproject.preview.header=启用并试用工作区模式
pyproject.preview.how.it.works=工作原理是什么?
pyproject.preview.how.it.works.content=包含 <b>pyproject.toml</b> 的目录将成为托管的 Python 项目 <icon src\="PythonPyprojectIcons.Model.PyProjectModule"/>(在下方高亮显示)。
pyproject.preview.how.to.create=如何创建工作区?
pyproject.preview.how.to.create.content=要让 IDE 解析工作区内项目之间的依赖关系，请使用以下方法之一在 <b>pyproject.toml</b> 中声明它们。
pyproject.preview.learn.more=了解详情
pyproject.preview.poetry=Poetry 路径依赖
pyproject.preview.poetry.content=[tool.poetry.dependencies]\nmy-lib \= { path \= "../my-lib", develop \= true }
pyproject.preview.project.structure=项目结构
pyproject.preview.select.in.project.view=在项目视图中选择
pyproject.preview.settings.note=或在<a href\="jetbrains\://Python/settings?name\=Project+Structure">设置 > 项目结构</a>中切换。
pyproject.preview.sub.project.naming=Python 项目命名
pyproject.preview.sub.project.naming.content=每个项目名称均派生自其 pyproject.toml 中的 <b>[project] name</b> 字段。如果缺少该字段，则改用目录名称。<br/><br/>IDE 中的项目名称必须唯一。当多个 pyproject.toml 文件解析为相同名称时，IDE 会附带 <b>@N</b> 后缀(从 <b>@1</b> 开始)以消除歧义。要避免这种情况，请确保工作区中的每个 pyproject.toml 都声明了不同的 <b>[project] name</b>。
pyproject.preview.tab.title=启用工作区模式
pyproject.preview.uv.independent=uv 路径依赖
pyproject.preview.uv.independent.content=[project]\ndependencies \= ["my-lib"]\n\n[tool.uv.sources]\nmy-lib \= { path \= "../my-lib" }
pyproject.preview.uv.independent.description=每个项目都有自己的虚拟环境。
pyproject.preview.uv.workspaces=uv 工作区
pyproject.preview.uv.workspaces.content=[tool.uv.workspace]\nmembers \= ["packages/*"]\n\n[project]\ndependencies \= ["my-lib"]\n\n[tool.uv.sources]\nmy-lib \= { workspace \= true }
pyproject.preview.uv.workspaces.description=所有项目共享的单个虚拟环境。
