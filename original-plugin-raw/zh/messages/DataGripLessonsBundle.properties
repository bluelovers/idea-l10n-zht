datagrip.onboarding.driver.download.failed=H2 数据库驱动程序下载失败。请检查您的网络连接和代理设置，然后点击下方的<strong>继续</strong>重试。没有驱动程序，导览将无法继续。
datagrip.onboarding.execute.query=在此导览中，我们已在您的新查询控制台中添加了一个示例 SQL 脚本。点击 {0} 执行。
