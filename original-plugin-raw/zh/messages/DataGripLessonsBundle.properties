datagrip.onboarding.select.schemas.dialog.tabs=<strong>常规</strong>标签页包含连接配置。<strong>架构</strong>标签页允许您选择要内省的数据库和架构。
datagrip.onboarding.select.schemas.explore=浏览对话框及其标签页，然后将其关闭以继续导览。
datagrip.onboarding.submit.changes=我们已为您更改了网格中的一个值。请注意，由于有待处理的更改，数据编辑器工具栏上的 {0} <strong>提交</strong>按钮现在处于激活状态。
datagrip.onboarding.submit.changes.description=当您点击 {0} <strong>提交</strong>时，DataGrip 会累加您的编辑内容并根据所选的提交模式对其进行处理。
datagrip.onboarding.tool.windows=默认情况下，工具窗口吸附在主窗口的底部和两侧。您可以通过更改其视图模式来重新排列、调整大小，甚至将它们分离出来作为单独的窗口使用。
datagrip.onboarding.view.options=<strong>视图选项</strong>菜单允许您自定义<strong>数据库资源管理器</strong>的显示内容以及数据库对象树的组织方式，包括分组、排序、可见元素和条目详细信息。
