datagrip.onboarding.expand.data.source.node=在<strong>数据库资源管理器</strong>中展开<strong>{0}</strong>数据源节点，以查看所选的数据库和架构。
datagrip.onboarding.extractors=要为当前数据编辑器标签页选择数据提取程序，请打开工具栏上的数据提取程序列表，然后选择要使用的数据提取程序。
datagrip.onboarding.extractors.description=要查看、复制或导出多种格式的数据，请使用数据提取程序。例如，您可以复制 CSV、JSON 或 Markdown 格式的数据，也可以复制为 SQL {0} 语句。
datagrip.onboarding.highlight.datasource=在本次导览中，我们设置了使用 H2 数据库的 <strong>{0}</strong> 演练场数据源。DataGrip 将连接到该数据源并自动对其进行内省。
