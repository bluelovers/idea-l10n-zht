datagrip.onboarding.record.view=查询结果显示在<strong>服务</strong>工具窗口的<strong>结果</strong>标签页中的数据编辑器里。数据编辑器提供工具栏和上下文菜单操作，用于查看和编辑数据，以及将更改提交到数据库。
datagrip.onboarding.record.view.description=对于包含很多列的行非常有用\: <strong>记录</strong>窗格可以通过两种可选布局来显示单条记录。
