datagrip.onboarding.attach.directory.description=<ide/> 会分析附加的目录，并使目录中的文件可用于搜索、导航和语法高亮显示。在可能的情况下，这些文件中的数据库对象会被解析到现有的数据源。
datagrip.onboarding.congratulations=恭喜\! 您已完成 <ide/> 入门导览。演练场数据库将被自动移除。接下来，您可以点击<strong>数据库资源管理器</strong>工具栏上的 {0} 添加您自己的数据源。
