pool.details.header=Pooled ACP client
pool.help=How the pool deduplicates agents\n----------------------------------------\nThe pool keeps at most one live agent process per identity key. Two acquires whose\nkey matches on ALL of the following reuse the same process (a shared client);\nany difference forks a separate process\:\n  • agentId             — the resolved registry id of the agent\n  • startConfig         — fingerprint of command / baseArgs / args / env / workingDir\n  • cwd                 — the project working directory (exact path, no canonicalization)\n  • eelDescriptor       — the execution environment (local, WSL, Docker, …)\n  • policyDiscriminator — null for Shared; the threadId for DedicatedClientPerThread\n\nEach chat thread that uses a client holds a lease; the process is stopped when the\nlast lease is released. Select a client on the left to see its state, pid, uptime\nand the exact key that identifies it.
