报告名称太短、太长或不遵循指定正则表达式模式的局部变量。
<p>只能在编辑器中使用重命名此类变量的快速修复。</p>
<p><b>示例：</b></p>
<pre><code>
  int X = 42;
</code></pre>
如果使用默认设置（其中变量名称应以小写字母开头）启用检查，将报告此示例。
<!-- tooltip end -->
<p>
  使用<b>选项</b>部分中的字段可以指定可接受的局部变量名称的最小长度、最大长度以及正则表达式。
  在长度字段中指定 <b>0</b> 可以跳过相应检查。
  正则表达式采用标准 <b>java.util.regex</b> 格式。
</p>
<p>使用复选框忽略 <code>for</code> 循环形参、<code>catch</code> 部分形参和模式变量。</p>
