报告不包含变量插值、表达式插值和转义序列，因此可以写成 nowdoc 的 heredoc 字符串字面量。

<p>根据 PER-CS 3.0 §10，应尽可能使用 <code>nowdoc</code>。 不依赖于任何插值或转义处理功能的 heredoc 与对应的 nowdoc 等效，而且读起来更清晰。</p>

<p>
  请参阅 <a href="https://www.php-fig.org/per/coding-style/#10-heredoc-and-nowdoc">PER Coding Style 3.0 (php-fig.org)</a> 了解详细信息。
</p>
