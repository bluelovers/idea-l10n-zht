报告对 <code>String.replaceAll()</code> 的调用，其中第一个实参为普通（非正则表达式）字符串字面量，并且替换项也是普通字符串字面量。 在这种情况下，使用 <code>String.replace()</code> 更清晰，并且可以避免正则表达式带来的开销。

<p><b>示例：</b></p>
<pre><code>
  "a,b,c".replaceAll(",", ";");
</code></pre>

<p>在应用快速修复后：</p>
<pre><code>
  "a,b,c".replace(",", ";");
</code></pre>

<p>
注意：该检查仅在安全时建议替换，即当模式不包含正则表达式元字符，且替换项不包含正则表达式替换项使用的特殊字符（如 <code>$</code> 或 <code>\</code>）时。
</p>
