报告在未使用圆括号的情况下使用 <code>exit</code> 或 <code>die</code> 的情况。

<p>根据 PER-CS 3.0 §4.7，即使 PHP 技术上允许不使用圆括号，也应该始终使用圆括号调用 <code>exit()</code> 和 <code>die()</code>。</p>

<p>
  请参阅 <a href="https://www.php-fig.org/per/coding-style/#47-function-call-parentheses">PER Coding Style 3.0 (php-fig.org)</a> 了解详细信息。
</p>
