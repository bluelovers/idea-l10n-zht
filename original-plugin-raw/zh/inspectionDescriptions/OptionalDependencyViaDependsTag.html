报告插件使用 `depends` 标签声明对另一个插件的可选依赖关系的情况。
<p>
  实验性<a href="https://plugins.jetbrains.com/docs/intellij/modular-plugins.html">模块化插件</a>提供了另一种方式，仅在加载了另一个插件时才加载插件的某一部分：将相应的类和资源移至独立模块，并将其注册为依赖于目标插件的插件内容模块。
  通过这种方式，可以在编译时检查所有依赖于目标插件 API 的插件代码是否位于该独立模块中。
</p>
<p>
  鉴于模块化插件目前是实验性的，建议仅为 IntelliJ 单仓库中的插件迁移可选依赖项，以使用插件内容模块。
</p>
</body>
