<body>
报告 IntelliJ 主题文件 (<code>*.theme.json</code>) 中未使用的主题颜色。
<p>
  命名颜色在主题文件的 <code>colors</code>（颜色）部分定义。
  如果一个颜色没有在同一文件中的 <code>ui</code> 部分或渐变定义中引用，则该颜色被视为未使用。
</p>
<p>
  有关详情，请参阅 SDK 文档中的<a href="https://plugins.jetbrains.com/docs/intellij/themes-metadata.html">公开主题元数据</a>。
</p>
</body>
</html>
