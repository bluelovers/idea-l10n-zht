<body>
报告脚本标记上具有 <code>generics</code> 特性但没有 TypeScript (<code>lang="ts"</code>) 的情况。
<p><code>generics</code> 特性要求在脚本标记上启用 TypeScript。</p>
<p>无效代码示例：</p>
<pre><code>&lt;script generics="T extends string"&gt;
  // 错误：generics 要求启用 TypeScript
&lt;/script&gt;</code></pre>
<p>有效代码示例：</p>
<pre><code>&lt;script lang="ts" generics="T extends string"&gt;
  // 正确：TypeScript 已启用
&lt;/script&gt;</code></pre>
</body>
</html>
