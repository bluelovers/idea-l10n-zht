报告名称太短、太长或不遵循指定正则表达式模式的软件包。
<p>只能在编辑器中使用重命名此类软件包的快速修复。</p>
<p><b>示例：</b></p>
<pre><code>
  package io;
</code></pre>
如果使用默认设置（其中软件包名称的最小长度应为 3）启用检查，将报告此示例。
<!-- tooltip end -->
<p>
  使用<b>选项</b>部分中的字段可以指定可接受软件包名称的最小长度、最大长度以及正则表达式。
  在长度字段中指定 <b>0</b> 可以跳过相应检查。
  正则表达式采用标准 <code>java.util.regex</code> 格式。
</p>
</body>
