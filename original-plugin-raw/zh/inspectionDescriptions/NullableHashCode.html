<p>报告 <code>value?.hashCode() ?: 0</code>，并建议将其替换为 <code>value.hashCode()</code>。</p>
<!-- tooltip end -->
<p>自 Kotlin 1.3 以来，标准库提供了 <code>Any?.hashCode()</code>，它会对 <code>null</code> 返回 <code>0</code>，在其他情况下，则委托给接收者的 <code>hashCode()</code>。</p>
<pre><code>
fun hash(value: String?): Int {
    return value?.hashCode() ?: 0
}
</code></pre>
<p>应用该快速修复后：</p>
<pre><code>
fun hash(value: String?): Int {
    return value.hashCode()
}
</code></pre>
