<body>
报告名称太短、太长或不遵循指定正则表达式模式的方法。
<p>只能在编辑器中使用重命名此类方法的快速修复。</p>
<p>此检查将忽略重写库方法和构造函数的实例方法。</p>
<p><b>示例：</b></p>
<pre><code>
  public static int n() {
    return 0;
  }
</code></pre>
如果使用默认设置（其中方法名称的最小长度应为 4）为 <code>static</code> 方法启用检查，将报告此示例。
<!-- tooltip end -->
<p>使用<b>选项</b>部分中的列表来指定应检查的方法类型。</p>
<p>
  您可以为每个方法类型指定可接受方法名称的最小长度、最大长度和正则表达式。
  在长度字段中指定 <b>0</b> 可以跳过相应检查。
  正则表达式采用标准 <code>java.util.regex</code> 格式。
</p>
</body>
