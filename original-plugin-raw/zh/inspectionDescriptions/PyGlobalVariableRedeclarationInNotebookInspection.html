<h3>Notebook 中的全局变量重新声明</h3>
<p>
  此检查会检测在同一 Jupyter Notebook 中重新声明全局变量的情况。
  重新定义全局变量可能会导致意想不到的结果或 Bug，特别是在以任意顺序执行单元时。
</p>
<p>
  为了降低噪声，对公共循环变量（例如，<code>i</code>、<code>j</code>、<code>k</code> 等）的重新定义会被忽略。
  不过，对列表、DataFrames 或字典等较大对象的重新定义会被标记为潜在问题。
</p>
<p>
  如果该重新定义是有意的，您可以使用提供的“对此语句禁止”快速修复来消除该特定情况下的警告。
</p>
<p>
  注意：此检查仅适用于 Jupyter Notebook 文件 (<code>.ipynb</code>)。
</p>
</body>
