<body>
报告首字母缩写词全部采用大写字母书写的类、方法、属性、函数、形参和局部变量名称（例如，<code>XMLFormatter</code>、<code>parseXMLDocument</code>、<code>$URLPrefix</code>、<code>parseHTTPHeader</code>、<code>$HTTPStatus</code>）。

<p>根据 PER-CS 3.0 §2.7 的规定，首字母缩写词只有第一个字符是大写，因此建议使用 <code>XmlFormatter</code>，而不是 <code>XMLFormatter</code>。</p>

<p>
  有关详细信息，请参阅 <a href="https://www.php-fig.org/per/coding-style/#27-names">PER Coding Style 3.0 (php-fig.org)</a>。
</p>
