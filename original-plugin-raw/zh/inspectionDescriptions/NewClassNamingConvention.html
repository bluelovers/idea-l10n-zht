报告名称太短、太长或不遵循指定正则表达式模式的类。
<p>只能在编辑器中使用重命名此类类的快速修复。</p>
<p><b>示例：</b></p>
<pre><code>
  public class Yes{}
</code></pre>
如果使用默认设置（其中类名称的最小长度应为 8）为测试类启用检查，将报告此示例。
<!-- tooltip end -->
<p>使用<b>选项</b>部分中的列表来指定应检查的类类型。</p>
<p>
  您可以为每个类类型指定可接受类名称的最小长度、最大长度和正则表达式。
  在长度字段中指定 <b>0</b> 可以跳过相应检查。
  正则表达式采用标准 <code>java.util.regex</code> 格式。
</p>
