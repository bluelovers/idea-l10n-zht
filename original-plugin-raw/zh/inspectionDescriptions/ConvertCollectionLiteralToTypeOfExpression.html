<body>
报告可被替换为显式 <code>Type.of(...)</code> 调用的集合字面量。

<p>示例：</p>
<pre><code>
class MyCustomList&lt;T&gt; {
    companion object { operator fun &lt;T&gt; of(vararg elements: T): MyCustomList&lt;T&gt; = TODO() }
}

val nums: MyCustomList&lt;Int&gt; = [1, 2, 3]
</code></pre>
<p>应用修正后：</p>
<pre><code>
val nums = MyCustomList.of(1, 2, 3)
</code></pre>
</body>
</html>
