报告在构造函数提升的属性上使用长格式 <code>set</code> 钩子的情况。

<p>根据 PER-CS 3.0 §4.9 的规定，构造函数提升的属性只能使用简写的 <code>=> expression</code> 形式定义 <code>set</code> 钩子。 任何非普通的 setter 逻辑都必须移至单独的方法中，并通过钩子进行调用。</p>

<p>
  有关详细信息，请参阅 <a href="https://www.php-fig.org/per/coding-style/#49-property-hooks">PER Coding Style 3.0 (php-fig.org)</a>。
</p>
