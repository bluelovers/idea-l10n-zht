<body>
报告使用了 RSpec 4 中弃用的语法。

<p>
弃用语法示例：
</p>
<ul>
  <li>全局公开的 DSL（顶层的 <code>describe</code> 和其他示例群组/共享上下文调用，没有 <code>RSpec.</code> 限定符）</li>
  <li>传递给 <code>include_examples</code> 和 <code>include_context</code> 的块实参</li>
  <li><code>should</code>，而不是 <code>expect</code></li>
  <li><code>it_should_behave_like</code>，而不是 <code>it_behaves_like</code></li>
</ul>
</body>
