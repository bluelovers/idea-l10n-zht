action.PyProjectTomlSyncAction.text=使用 `pyproject.toml` 同步專案
intellij.python.pyproject.name=從 pyproject.toml 生成專案
intellij.python.pyproject.system.name=基於 `pyproject.toml` 的專案
pyproject.notification.configure=啟用
pyproject.notification.content=從 pyproject.toml 檔案派生工作區結構和相依項。<br/>此模式將覆寫手動專案設定。請考慮先備份 .idea 目錄。
pyproject.notification.dont.show.again=不再顯示
pyproject.notification.title=檢測到 Pyproject.toml 工作區
pyproject.preview.after=之後
pyproject.preview.current=之前
pyproject.preview.dependencies=相依項
pyproject.preview.dependencies.content=專案之間的相依關係會根據 <b>pyproject.toml</b> 宣告自動解析。專案結構存儲在 <b>.idea</b> 目錄下的 <b>.iml</b> 檔案中，並在每次同步時從 pyproject.toml 生成。
pyproject.preview.description=大型專案可以拆分為較小的部分(如後端、API 和共享程式碼)，使其更易於組織和維護。
pyproject.preview.enable=啟用工作區
pyproject.preview.header=啟用並試用工作區模式
pyproject.preview.how.it.works=工作原理是什麼?
pyproject.preview.how.it.works.content=包含 <b>pyproject.toml</b> 的目錄將成為托管的 Python 專案 <icon src\="PythonPyprojectIcons.Model.PyProjectModule"/>(在下方醒目提示)。
pyproject.preview.how.to.create=如何建立工作區?
pyproject.preview.how.to.create.content=要讓 IDE 解析工作區內專案之間的相依關係，請使用以下方法之一在 <b>pyproject.toml</b> 中宣告它們。
pyproject.preview.learn.more=了解詳情
pyproject.preview.poetry=Poetry 路徑相依
pyproject.preview.poetry.content=[tool.poetry.dependencies]\nmy-lib \= { path \= "../my-lib", develop \= true }
pyproject.preview.project.structure=專案結構
pyproject.preview.select.in.project.view=在專案檢視中選擇
pyproject.preview.settings.note=或在<a href\="jetbrains\://Python/settings?name\=Project+Structure">設定 > 專案結構</a>中切換。
pyproject.preview.sub.project.naming=Python 專案命名
pyproject.preview.sub.project.naming.content=每個專案名稱均派生自其 pyproject.toml 中的 <b>[project] name</b> 欄位。如果缺少該欄位，則改用目錄名稱。<br/><br/>IDE 中的專案名稱必須唯一。當多個 pyproject.toml 檔案解析為相同名稱時，IDE 會附帶 <b>@N</b> 後綴(從 <b>@1</b> 開始)以消除歧義。要避免這種情況，請確保工作區中的每個 pyproject.toml 都宣告了不同的 <b>[project] name</b>。
pyproject.preview.tab.title=啟用工作區模式
pyproject.preview.uv.independent=uv 路徑相依
pyproject.preview.uv.independent.content=[project]\ndependencies \= ["my-lib"]\n\n[tool.uv.sources]\nmy-lib \= { path \= "../my-lib" }
pyproject.preview.uv.independent.description=每個專案都有自己的虛擬環境。
pyproject.preview.uv.workspaces=uv 工作區
pyproject.preview.uv.workspaces.content=[tool.uv.workspace]\nmembers \= ["packages/*"]\n\n[project]\ndependencies \= ["my-lib"]\n\n[tool.uv.sources]\nmy-lib \= { workspace \= true }
pyproject.preview.uv.workspaces.description=所有專案共享的單個虛擬環境。
