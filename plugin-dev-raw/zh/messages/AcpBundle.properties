acp.claude.terms.of.service.text=要在 AI Assistant 中使用 Claude Agent，您需要先进行安装。点击“安装并继续”后，系统将自动完成安装。安装过程受您与 Anthropic 之间的相关<a href\="{0}">协议</a>约束。点击“安装并继续”即表示您接受此协议。<br/>安装完成后，Anthropic 可能会根据其条款处理您的数据。<br/>您通过 JetBrains AI 登录方式使用 Claude Agent 的行为，受适用的 JetBrains 协议约束。如果您选择使用其他智能体登录/授权方式，则不会使用 JetBrains AI 服务，JetBrains 不对您的输入、生成的输出或执行的任何操作的处理承担任何责任。
acp.codex.agent.description=Codex 是 OpenAI 开发的一款功能强大的编码智能体，它可以在您的 IDE 中与您协同工作，构建功能、修正 bug、审查代码和回答问题。
acp.codex.terms.of.service.text=要在 AI Assistant 中使用 Codex，您必须先进行安装。点击“安装并继续”后将自动安装。安装过程受 <a href\="{0}">Apache License, Version 2.0</a>约束。<br>安装完成后，Codex 的提供商可能会根据其条款处理您的数据。<br>您通过 JetBrains AI 登录使用 Codex 的行为受适用的 JetBrains 协议约束。如果您选择使用其他智能体登录/授权方式，则不会使用 JetBrains AI 服务，JetBrains 对您的输入、生成的输出或任何执行操作的处理不承担任何责任。
acp.copilot.terms.of.service.text=要在 AI Assistant 中使用 GitHub Copilot CLI，您需要先进行安装。点击“安装并继续”后，它将自动安装。安装过程受 <a href\="{0}">GitHub Copilot CLI 许可协议</a>约束。<br>安装完成后，您的数据可能会由 GitHub Copilot 提供商根据其条款进行处理。<br>JetBrains 不对您的输入、生成的输出或执行的任何操作的处理负责。
