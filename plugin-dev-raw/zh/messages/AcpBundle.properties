acp.codex.agent.description=Codex 是 OpenAI 開發的一款功能強大的編碼智能體，它可以在您的 IDE 中與您協同工作，建置功能、修正 bug、審查程式碼和回答問題。
acp.codex.terms.of.service.text=要在 AI Assistant 中使用 Codex，您必須先進行安裝。點擊“安裝並繼續”後將自動安裝。安裝過程受 <a href\="{0}">Apache License, Version 2.0</a>約束。<br>安裝完成後，Codex 的提供商可能會根據其條款處理您的資料。<br>您通過 JetBrains AI 登入使用 Codex 的行為受適用的 JetBrains 協議約束。如果您選擇使用其他智能體登入/授權方式，則不會使用 JetBrains AI 服務，JetBrains 對您的輸入、生成的輸出或任何執行動作的處理不承擔任何責任。
acp.copilot.terms.of.service.text=要在 AI Assistant 中使用 GitHub Copilot CLI，您需要先進行安裝。點擊“安裝並繼續”後，它將自動安裝。安裝過程受 <a href\="{0}">GitHub Copilot CLI 許可協議</a>約束。<br>安裝完成後，您的資料可能會由 GitHub Copilot 提供商根據其條款進行處理。<br>JetBrains 不對您的輸入、生成的輸出或執行的任何動作的處理負責。
