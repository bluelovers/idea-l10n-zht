emmet.context.help.tooltip=使用 Emmet 縮寫更新 HTML 標記\:<br/>\n.class[attribute] 用於覆蓋值；<br/>\n.+class[attribute] 用於附加值；<br/>\n.-class[attribute] 用於移除值。<br/>\n<p/>\n例如，<code>.+c2[title\=Hello]</code> 縮寫將<br/>\n<code>\\&lt;div class\="c1"\\&gt;</code> 更新為<br/>\n<code>\\&lt;div class\="c1 c2" title\="Hello"\\&gt;</code>。
