demo.gaps.description=<br>• 水平間距由 Cell.gap 方法管理。標籤與其關聯組件之間使用 RightGap.SMALL，否則使用中等間距(不存在此枚舉值)。<br>• 可以使用 Panel.indent 新增左縮排。<br>• 對於兩列模式，請使用 Panel.twoColumnsRow 或 RightGap.COLUMNS。<br>• 預設情況下沒有垂直間距(組件之間存在最小間距)，可以使用 Row.topGap 和 Row.bottomGap 方法進行新增。此類別間距應追加到 'related' 行(這樣，即使帶有間距的行被隱藏，剩餘布局也不會被破壞)。請注意，某些元素(例如 Panel.group)可能會在其周圍新增額外的空間
