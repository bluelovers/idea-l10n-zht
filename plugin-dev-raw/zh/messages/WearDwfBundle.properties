inspection.invalid.color.index.description=<html>一種顏色組態可以包含多種顏色作為調色板的一部分。如果包含多種顏色，組態參照必須指定顏色在該調色板中的索引。例如\: [CONFIGURATION.myColor.0]。如果調色板中只有一種顏色，則索引可選。<br/>請閱讀 <a href\="https\://developer.android.com/reference/wear-os/wff/user-configuration/color-configuration">ColorConfiguration</a> 文檔了解更多資訊。</html>
