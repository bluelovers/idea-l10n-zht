aitoolkit.feed.empty.text=<h5>此處將顯示 AI 智能體的追蹤資訊</h5><p>AI Agents Debugger 延伸模組將在本地追蹤您的 Koog 智能體的執行。無需更改程式碼。</p><p>啟動您的<b><inline_content_element>執行</inline_content_element></b>執行組態。</p><p>包含智能體步驟和決策的追蹤資訊將自動顯示在此處。</p>
aitoolkit.feed.outdatedKoog.text=<h5>您的 Koog 版本似乎已過時</h5><p>請將 Koog 更新至 <b>0.5.2</b> 或更高版本，以啟用對 AI Agents Debugger 的支援。</p><p>然後啟動您的<b><inline_content_element>執行</inline_content_element></b>執行組態。</p>
