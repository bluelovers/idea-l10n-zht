stm32.cube.mx.project.wizard.html=<ol style\="margin-top\: 0;"><li>在 STM32CubeMX 中\:<ol type\="a"><li>在 <i>New Project</i> 面板中，點擊 <i>ACCESS TO MCU SELECTOR</i>。您也可以選擇 <i>ACCESS TO BOARD SELECTOR</i>。</li><li>選擇您的 MCU 或開發板。</li><li>點擊 <i>Start Project</i>。</li><li>在生成的裝置組態視窗中，組態必要的外設和中間件。</li><li>導覽到 <i>Project Manager</i> 頁籤。</li><li>從 <i>Toolchain / IDE</i> 下拉選單中選擇 <i>CMake</i>。</li><li>在 <i>Project Name</i> 欄位中輸入您的專案的名稱。</li><li>點擊 <i>GENERATE CODE</i>。</li><li>使用鍵盤快捷鍵 <i>{0}</i> 從 <i>Toolchain Folder Location</i> 欄位複製路徑。</li></ol></li><li>在 CLion 中\:<ol type\="a"><li>在此對話框頂部的<i>位置</i>欄位中輸入您複製的路徑。</li><li>點擊<i>{1}</i>。</li></ol></li><li>您的 STM32CubeMX 專案現已建立完成。</li></ol>
