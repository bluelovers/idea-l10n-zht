onboarding.add.to.dataset.inputs.step.header=<b>審查輸入並儲存</b>
onboarding.add.to.dataset.inputs.step.text=快速核實下方的<b>輸入 JSON 路徑</b>，<b>預期輸出 JSON 路徑</b>和<b>預期輸出</b>。<br>然後點擊<b>新增</b>以儲存追蹤資訊。
onboarding.add.to.dataset.step.header=<b>新增到資料集</b>
onboarding.add.to.dataset.step.text=點擊<b>新增資料集</b>以建立您的第一個資料集。
onboarding.create.config.form.step.header=<b>組態評估</b>
onboarding.create.config.form.step.text=選擇<b>執行組態</b>，設定<b>名稱</b>，然後選擇<b>輸入資料集</b>。<br>如有需要，請調整 <b>LLM-as-a-Judge 提示詞</b>和<b>模型</b>。<br>然後點擊<b>確定</b>確認組態。
onboarding.enter.dataset.name.step.header=<b>新增到資料集</b>
onboarding.enter.dataset.name.step.text=輸入資料集<b>名稱</b>。
onboarding.evaluation.plus.step.header=<b>建立組態</b>
onboarding.evaluation.plus.step.text=點擊此處以建立新的評估組態。
onboarding.evaluation.run.cloud.step.header=<b>進階\: 在雲端執行評估</b>
onboarding.evaluation.run.cloud.step.text=您可以通過 Cadence 延伸模組在雲端執行長時間執行的評估
onboarding.evaluation.run.step.header=<b>執行評估</b>
onboarding.evaluation.run.step.text=點擊此處以開始新評估。
onboarding.gotIt.button.done=完成導覽
onboarding.gotIt.button.hide=隱藏
onboarding.gotIt.button.next=下一步
onboarding.gotIt.button.one.last=還有一件事
onboarding.gotIt.button.repeat=重複導覽
onboarding.intro.button.skip=跳過導覽
onboarding.intro.button.start=開始導覽
onboarding.intro.step.header=<b>歡迎使用 AI 評估</b>
onboarding.intro.step.text=我們將協助您建立第一個資料集，並針對該資料集對您的智能體進行評估。
onboarding.repeat.onboarding.step.header=<b>重複導覽</b>
onboarding.repeat.onboarding.step.text=您隨時可以點擊此處重複本導覽。祝評估過程順利\!
onboarding.results.output.step.header=<b>審查輸出</b>
onboarding.results.output.step.text=您可以在此處檢查評估結果。
onboarding.select.dataset.step.header=<b>新增到資料集</b>
onboarding.select.dataset.step.text=選擇要新增條目的資料集。您可以一次將追蹤資訊新增到多個資料集。
onboarding.switch.to.datasets.step.header=<b>切換到資料集</b>
onboarding.switch.to.datasets.step.text=您的追蹤結果已新增到資料集。您隨時可以在“資料集”頁籤中找到您的條目。
onboarding.switch.to.evaluation.step.header=<b>切換到評估</b>
onboarding.switch.to.evaluation.step.text=這是“評估”頁籤。您可以在此處針對資料集評估您的智能體。但首先，您需要為其建立執行組態。
