manual.context.paste.image.title=圖片
popup.suggestion.editor.explain.label=解釋程式碼
popup.suggestion.editor.explain.prompt=解釋所選程式碼及其呼叫方的使用方式。
popup.suggestion.editor.refactor.label=重構程式碼
popup.suggestion.editor.refactor.prompt=重構所選程式碼以提高可讀性。請勿改變可觀測的行為，保持相同的返回值、相同的異常、相同的副作用以及相同的執行緒處理。無法您確保某項轉換的等價性，請跳過該轉換並說明原因。請列出您套用的每項轉換。
popup.suggestion.editor.review.label=審查程式碼
popup.suggestion.editor.review.prompt=檢查所選程式碼是否存在 bug、邊緣情況或缺失測試。
popup.suggestion.paths.duplication.label=尋找重複項
popup.suggestion.paths.duplication.prompt=在這些檔案中尋找重複的邏輯、重疊的職責或幾乎相同的結構。
popup.suggestion.paths.impact.label=映射影響
popup.suggestion.paths.impact.prompt=映射這些檔案之間的相依與呼叫關係；如果其中任何一項發生更改時，醒目提示可能的影響範圍。
popup.suggestion.paths.summary.label=總結檔案
popup.suggestion.paths.summary.prompt=總結這些檔案的功能以及它們之間的相互關係。
popup.suggestion.tests.bisect.label=二分定位
popup.suggestion.tests.bisect.prompt=找到引入這些故障的提交。閱讀失敗的測試檔案及其所執行的生產程式碼路徑上的 `git log -p`；從差異而非提交資訊中找出可疑之處。列出你認為最有可能的 1 到 3 個候選提交，並附上可能導致回歸的差異區塊。除非你實際執行過該修訂版的測試，否則不要妄下斷言。
popup.suggestion.tests.coverage.label=解釋覆蓋率
popup.suggestion.tests.coverage.prompt=解釋這些測試涵蓋哪些內容，驗證哪些行為，以及忽略哪些行為。
popup.suggestion.tests.explain.label=解釋失敗原因
popup.suggestion.tests.explain.prompt=解釋這些測試失敗的原因以及導致失敗的程式碼。請勿修改任何程式碼。
popup.suggestion.tests.extend.label=新增測試
popup.suggestion.tests.extend.prompt=在與所選測試相同的測試檔案中新增測試，以覆蓋相同被測單元中現有測試所遺漏的行為。對於每個新測試，請說明其填補的覆蓋率空白。
popup.suggestion.tests.fix.label=修復故障
popup.suggestion.tests.fix.prompt=讓失敗的測試通過。首先，在會話檢視中，針對每個失敗的測試，指出 bug 是存在於生產程式碼還是測試程式碼中，並用一句話說明原因。然後，只修復您指出的那一側。請勿弱化斷言或刪除測試用例。
popup.suggestion.tests.review.label=審核測試
popup.suggestion.tests.review.prompt=審核這些測試，檢查是否存在脆弱的假設、薄弱的斷言、隱藏的相依項或可疑的通過情況。
popup.suggestion.vcs.followup.label=列出後續工作
popup.suggestion.vcs.followup.prompt=列出這些提交所隱含的後續工作、TODO 和未完成事項 - 尚未新增的測試、尚未清理的參照、留待以後處理的行為。
popup.suggestion.vcs.review.label=審查提交
popup.suggestion.vcs.review.prompt=審查所選提交是否存在風險、回歸或遺漏的後續工作。
popup.suggestion.vcs.summary.label=總結提交
popup.suggestion.vcs.summary.prompt=按區域分組匯總這些提交中發生的變化；指出任何有風險或異常的地方。
