chat.codex.chat.mode.description=Codex 是 OpenAI 開發的一款功能強大的編碼智能體，它可以在您的 IDE 中與您協同工作，建置功能、修正 bug、審查程式碼和回答問題。
codex.acp.agent.confirm.install.byok=點擊“安裝並繼續”後，將自動安裝 Codex。安裝受 <a href\={0}>Apache License, Version 2.0</a> 約束。您的資料將由外部服務提供商根據其條款進行處理。JetBrains 對您的輸入處理、生成的輸出或任何其他動作不承擔任何責任。
codex.acp.agent.confirm.install.enterprise=要在 AI Assistant 中使用 Codex，Codex 將在您點擊“安裝並繼續”後自動安裝。<br>安裝受 <a href\="{0}">Apache License, Version 2.0</a> 約束。安裝完成後，您的資料可能會由外部提供商根據其條款進行處理。<br>在 AI Assistant 中進一步使用 Codex 受適用的 JetBrains 特殊許可條款的約束，具體取決於您是在<a href\="{1}">雲端</a>還是<a href\="{2}">本地</a>使用 JetBrains IDE 服務。<br>使用 Codex 會消耗您的 JetBrains AI 點數，除非您已關聯您在第三方供應商處的自有訂閱或在 AI Assistant 設定中提供了個人令牌。
codex.acp.agent.confirm.install.jba=要在 AI Assistant 中使用 Codex，Codex 將在您點擊“安裝並繼續”後自動安裝。<br>安裝受 <a href\="{0}">Apache License, Version 2.0</a> 約束。安裝完成後，您的資料可能會由外部提供商根據其條款進行處理。<br>在 AI Assistant 中進一步使用 Codex 受 <a href\="{1}">JetBrains AI 服務條款</a>約束。<br>使用 Codex 會消耗您的JetBrains AI 配額中的點數，除非您已關聯您在第三方供應商處的自有訂閱或在 AI Assistant 設定中提供了個人令牌。
codex.acp.agent.confirm.install.message=要在 AI Assistant 中使用 Codex，Codex 將在您點擊“安裝並繼續”後自動安裝。<br>安裝受 OpenAI 的<a href\="{0}">使用條款</a>約束。點擊“安裝並繼續”，即表示您同意這些條款。在 AI Assistant 中進一步使用 Codex 受 <a href\="{1}">JetBrains AI 服務條款</a>約束。<br>使用 Codex 會消耗您的 JetBrains AI 配額中的點數，除非您已關聯您在第三方供應商處的自有訂閱或在 AI Assistant 設定中提供了個人令牌。
