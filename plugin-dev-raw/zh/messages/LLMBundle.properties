toolwindow.stripe.AIAssistant=AI Assistant
user.intent.descriptions.assistant.capabilities=关于 {0} 的功能和局限性的问题。
user.intent.descriptions.code.conversion=根据用户提供的代码段，将代码从一种编程语言翻译或转换为另一种编程语言的请求。
user.intent.descriptions.code.explain=说明或描述所提供代码段的作用，而无需修改或生成新代码的请求。用户希望了解代码的用途或功能。
user.intent.descriptions.code.generation=根据用户描述的任务或要求生成新代码的请求。用户可能会提供一些上下文或现有代码，但主要目标是创建满足用户请求的新代码。
user.intent.descriptions.code.modification=修改或改进用户提供的现有代码段的请求。回答应包括反映所请求更改(例如优化、添加功能或更正代码)的修改后的代码。
user.intent.descriptions.code.question=专门针对提供的代码片段的询问。用户希望了解、验证或理解代码的运作方式或代码是否正确。必须明确提及或附上代码，并且用户不要求更改代码或查找 bug。
user.intent.descriptions.code.refactoring=对用户提供的现有代码进行重构或重组的请求，以改善其结构、可读性或可维护性，而不改变其功能。
user.intent.descriptions.error.explanation=用户描述问题，通常包括错误消息或不正确的输出，并要求解释或修正的请求。用户可能会或可能不会提供相关代码。重点是理解某些功能无法正常工作的原因。
user.intent.descriptions.find.bugs=专门针对识别和解释所提供代码段中的 bug 或错误的请求。用户希望回答能够指出问题并提出修正建议。
user.intent.descriptions.general.request=不需要特定代码段的一般信息请求。这些通常是类似于 Google 搜索的“如何做”类型的问题。示例包括询问一般概念、工具使用或编程做法。这些问题不需要了解用户的代码库。
user.intent.descriptions.intellij.question=与使用 IntelliJ IDEA 相关的查询，例如如何在 IDE 中访问某些功能或执行特定任务。
user.intent.descriptions.other=不属于任何其他预定义类别的消息，例如随机字符或不相关的内容。
user.intent.descriptions.project.specific=侧重于特定项目的整体结构、架构或具体细节，而不是一般性编码查询的问题。用户通常会询问特定项目中较高层次的概念或组织。
user.intent.descriptions.test.generation=针对提供的代码段创建测试用例的请求。用户希望回答包含可以验证原始代码正确性的相关测试代码。
