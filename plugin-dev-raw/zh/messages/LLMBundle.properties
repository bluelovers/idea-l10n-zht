user.intent.descriptions.assistant.capabilities=關於 {0} 的功能和局限性的問題。
user.intent.descriptions.code.conversion=根據使用者提供的程式碼段，將程式碼從一種編程語言翻譯或轉換為另一種編程語言的請求。
user.intent.descriptions.code.explain=說明或描述所提供程式碼段的作用，而無需修改或生成新程式碼的請求。使用者希望了解程式碼的用途或功能。
user.intent.descriptions.code.generation=根據使用者描述的任務或要求生成新程式碼的請求。使用者可能會提供一些上下文或現有程式碼，但主要目標是建立滿足使用者請求的新程式碼。
user.intent.descriptions.code.modification=修改或改進使用者提供的現有程式碼段的請求。回答應包括反映所請求變更(例如最佳化、新增功能或更正程式碼)的修改後的程式碼。
user.intent.descriptions.code.question=專門針對提供的程式碼片段的詢問。使用者希望了解、驗證或理解程式碼的運作方式或程式碼是否正確。必須明確提及或附上程式碼，並且使用者不要求變更程式碼或尋找 bug。
user.intent.descriptions.code.refactoring=對使用者提供的現有程式碼進行重構或重組的請求，以改善其結構、可讀性或可維護性，而不改變其功能。
user.intent.descriptions.error.explanation=使用者描述問題，通常包括錯誤訊息或不正確的輸出，並要求解釋或修正的請求。使用者可能會或可能不會提供相關程式碼。重點是理解某些功能無法正常工作的原因。
user.intent.descriptions.find.bugs=專門針對識別和解釋所提供程式碼段中的 bug 或錯誤的請求。使用者希望回答能夠指出問題並提出修正建議。
user.intent.descriptions.general.request=不需要特定程式碼段的一般資訊請求。這些通常是類似於 Google 搜尋的“如何做”類型的問題。範例包括詢問一般概念、工具使用或編程做法。這些問題不需要了解使用者的程式碼庫。
user.intent.descriptions.intellij.question=與使用 IntelliJ IDEA 相關的查詢，例如如何在 IDE 中存取某些功能或執行特定任務。
user.intent.descriptions.other=不屬於任何其他預定義類別的訊息，例如隨機字元或不相關的內容。
user.intent.descriptions.project.specific=側重於特定專案的整體結構、架構或具體細節，而不是一般性編碼查詢的問題。使用者通常會詢問特定專案中較高層次的概念或組織。
user.intent.descriptions.test.generation=針對提供的程式碼段建立測試用例的請求。使用者希望回答包含可以驗證原始程式碼正確性的相關測試程式碼。
