tos.content.text=要在 AI Assistant 中使用 Claude Agent，您需要先進行安裝。點擊“安裝並繼續”後，系統將自動完成安裝。安裝過程受您與 Anthropic 之間的相關<a href\="{0}">協議</a>約束。點擊“安裝並繼續”即表示您接受此協議。<br/>安裝完成後，Anthropic 可能會根據其條款處理您的資料。<br/>您通過 JetBrains AI 登入方式使用 Claude Agent 的行為，受適用的 JetBrains 協議約束。如果您選擇使用其他智能體登入/授權方式，則不會使用 JetBrains AI 服務，JetBrains 不對您的輸入、生成的輸出或執行的任何動作的處理承擔任何責任。
