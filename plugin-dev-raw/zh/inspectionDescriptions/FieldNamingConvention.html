報告名稱太短、太長或不遵循指定正則表達式模式的欄位。
<p>只能在編輯器中使用重新命名此類別欄位的快速修復。</p>
<p><b>範例：</b></p>
<pre><code>
  public static final int MAX = 42;
</code></pre>
如果使用預設設定（其中欄位名稱的最小長度應為 5）為常數啟用檢查，將報告此範例。
<!-- tooltip end -->
<p>使用<b>選項</b>部分中的列表來指定應檢查的欄位類型。</p>
<p>
  您可以為每個欄位類型指定可接受欄位名稱的最小長度、最大長度和正則表達式。
  在長度欄位中指定 <b>0</b> 可以跳過相應檢查。
  正則表達式採用標準 <code>java.util.regex</code> 格式。
</p>
