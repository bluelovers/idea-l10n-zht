檢測帶有備用欄位的屬性，並建議使用 <i>field</i> 關鍵字顯式引入備用欄位的重構。
<p><b>範例：</b></p>
<pre><code>
  private val _items = mutableListOf<Item>()
  val items: List<Item> get() = _items
</code></pre>
<p>在套用快速修復後：</p>
<pre><code>
  val items: List<Item>
    field = mutableListOf<Item>()
</code></pre>
