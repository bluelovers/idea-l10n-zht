<p>報告對 <a href="https://peps.python.org/pep-0810/">PEP 810</a> 引入的 <code>lazy</code> import 的無效使用。</p>
<p>標記了以下使用：</p>
<ul>
  <li>放置在函式、類別或 <code>try</code> 主體中的 <code>lazy</code> import &mdash; <code>lazy</code> import 必須顯示在模組級別；
  </li>
  <li><code>lazy from ... import *</code> &mdash; star import 不能為惰性；
  </li>
  <li><code>lazy from __future__ import ...</code> &mdash;
    <code>__future__</code> import 不能為惰性。
  </li>
</ul>
<p><b>範例：</b></p>
<pre><code>
def f():
    lazy import os  # lazy import 必須顯示在模組級別
</code></pre>
