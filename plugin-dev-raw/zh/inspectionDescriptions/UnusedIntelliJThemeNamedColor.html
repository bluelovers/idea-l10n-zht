<body>
報告 IntelliJ 主題檔案 (<code>*.theme.json</code>) 中未使用的主題顏色。
<p>
  命名顏色在主題檔案的 <code>colors</code>（顏色）部分定義。
  如果一個顏色沒有在同一檔案中的 <code>ui</code> 部分或漸變定義中參照，則該顏色被視為未使用。
</p>
<p>
  有關詳情，請參閱 SDK 文檔中的<a href="https://plugins.jetbrains.com/docs/intellij/themes-metadata.html">公開主題元資料</a>。
</p>
</body>
</html>
