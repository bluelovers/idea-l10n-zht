報告首字母縮寫詞全部採用大寫字母書寫的類別、方法、屬性、函式、參數和區域變數名稱（例如，<code>XMLFormatter</code>、<code>parseXMLDocument</code>、<code>$URLPrefix</code>、<code>parseHTTPHeader</code>、<code>$HTTPStatus</code>）。

<p>根據 PER-CS 3.0 §2.7 的規定，首字母縮寫詞只有第一個字元是大寫，因此建議使用 <code>XmlFormatter</code>，而不是 <code>XMLFormatter</code>。</p>

<p>
  有關詳細資訊，請參閱 <a href="https://www.php-fig.org/per/coding-style/#27-names">PER Coding Style 3.0 (php-fig.org)</a>。
</p>
