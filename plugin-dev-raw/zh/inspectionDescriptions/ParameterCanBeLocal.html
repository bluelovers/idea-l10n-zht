報告冗餘且可被取代為區域變數的方法參數。
<p>如果一個參數的所有用法都緊跟對該參數的賦值，則該參數可被取代為區域變數。
此類別參數是沒有必要的，因為傳遞給它的值會被覆蓋。
  此問題通常是重構的結果。</p>
<p>範例：</p>
<pre><code>
  void test(int p) {
    p = 1;
    System.out.print(p);
  }
</code></pre>
<p>在套用快速修復後：</p>
<pre><code>
  void test() {
    int p = 1;
    System.out.print(p);
  }
</code></pre>
