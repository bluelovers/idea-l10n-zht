報告名稱太短、太長或不遵循指定正則表達式模式的類別。
<p>只能在編輯器中使用重新命名此類別類別的快速修復。</p>
<p><b>範例：</b></p>
<pre><code>
  public class Yes{}
</code></pre>
如果使用預設設定（其中類別名稱的最小長度應為 8）為測試類別啟用檢查，將報告此範例。
<!-- tooltip end -->
<p>使用<b>選項</b>部分中的列表來指定應檢查的類別類型。</p>
<p>
  您可以為每個類別類型指定可接受類別名稱的最小長度、最大長度和正則表達式。
  在長度欄位中指定 <b>0</b> 可以跳過相應檢查。
  正則表達式採用標準 <code>java.util.regex</code> 格式。
</p>
