報告在建構函式提升的屬性上使用長格式 <code>set</code> 鈎子的情況。

<p>根據 PER-CS 3.0 §4.9 的規定，建構函式提升的屬性只能使用簡寫的 <code>=> expression</code> 形式定義 <code>set</code> 鈎子。 任何非普通的 setter 邏輯都必須移至單獨的方法中，並通過鈎子進行呼叫。</p>

<p>
  有關詳細資訊，請參閱 <a href="https://www.php-fig.org/per/coding-style/#49-property-hooks">PER Coding Style 3.0 (php-fig.org)</a>。
</p>
