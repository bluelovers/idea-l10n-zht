報告在未使用圓括號的情況下使用 <code>exit</code> 或 <code>die</code> 的情況。

<p>根據 PER-CS 3.0 §4.7，即使 PHP 技術上允許不使用圓括號，也應該始終使用圓括號呼叫 <code>exit()</code> 和 <code>die()</code>。</p>

<p>
  請參閱 <a href="https://www.php-fig.org/per/coding-style/#47-function-call-parentheses">PER Coding Style 3.0 (php-fig.org)</a> 了解詳細資訊。
</p>
