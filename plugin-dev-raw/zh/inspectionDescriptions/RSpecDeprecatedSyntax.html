<body>
報告使用了 RSpec 4 中棄用的語法。

<p>
棄用語法範例：
</p>
<ul>
  <li>全域公開的 DSL（頂層的 <code>describe</code> 和其他範例群組/共享上下文呼叫，沒有 <code>RSpec.</code> 限定符）</li>
  <li>傳遞給 <code>include_examples</code> 和 <code>include_context</code> 的塊實參</li>
  <li><code>should</code>，而不是 <code>expect</code></li>
  <li><code>it_should_behave_like</code>，而不是 <code>it_behaves_like</code></li>
</ul>
</body>
