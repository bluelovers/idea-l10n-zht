<html lang="zh">
<body>
報告腳本標記上具有 <code>generics</code> 特性但沒有 TypeScript (<code>lang="ts"</code>) 的情況。
<p><code>generics</code> 特性要求在腳本標記上啟用 TypeScript。</p>
<p>無效程式碼範例：</p>
<pre><code>&lt;script generics="T extends string"&gt;
  // 錯誤：generics 要求啟用 TypeScript
&lt;/script&gt;</code></pre>
<p>有效程式碼範例：</p>
<pre><code>&lt;script lang="ts" generics="T extends string"&gt;
  // 正確：TypeScript 已啟用
&lt;/script&gt;</code></pre>
</body>
</html>
