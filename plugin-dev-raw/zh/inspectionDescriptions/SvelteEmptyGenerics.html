<html lang="zh">
<body>
報告腳本標記上為空或僅包含空白字元的 <code>generics</code> 特性。
<p>無效程式碼範例：</p>
<pre><code>&lt;script lang="ts" generics=""&gt;
  export let value;
&lt;/script&gt;</code></pre>
<p>有效程式碼範例：</p>
<pre><code><script lang="ts" generics="T">
  export let value: T;
</script></code></pre>
</body>
</html>
