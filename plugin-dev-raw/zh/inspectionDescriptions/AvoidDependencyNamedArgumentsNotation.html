<p>檢測到為相依項使用了命名實參表示法，而可以使用 GAV 字串表示法，提供將其轉換為後者的快速修復。</p>
<p><b>範例：</b></p>
<pre><code lang="kotlin">
dependencies {
  implementation(group = "org.gradle.api", name = "gradle", version = "1.0") // reports the argument list
}
</code></pre>
<p>在套用快速修復後：</p>
<pre><code lang="kotlin">
dependencies {
  implementation("org.gradle.api:gradle:1.0")
}
</code></pre>
<p><a
  href="https://docs.gradle.org/9.3.0/userguide/best_practices_dependencies.html#single-gav-string">此處</a>介紹了最佳做法。</p>
</body>
</html>
