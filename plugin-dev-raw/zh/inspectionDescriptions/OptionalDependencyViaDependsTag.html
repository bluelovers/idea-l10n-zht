報告延伸模組使用 `depends` 標籤宣告對另一個延伸模組的可選相依關係的情況。
<p>
  實驗性<a href="https://plugins.jetbrains.com/docs/intellij/modular-plugins.html">模塊化延伸模組</a>提供了另一種方式，僅在載入了另一個延伸模組時才載入延伸模組的某一部分：將相應的類別和資源移至獨立模組，並將其註冊為依賴於目標延伸模組的延伸模組內容模組。
  通過這種方式，可以在編譯時檢查所有依賴於目標延伸模組 API 的延伸模組程式碼是否位於該獨立模組中。
</p>
<p>
  鑑於模塊化延伸模組目前是實驗性的，建議僅為 IntelliJ 單儲存庫中的延伸模組遷移可選相依項，以使用延伸模組內容模組。
</p>
