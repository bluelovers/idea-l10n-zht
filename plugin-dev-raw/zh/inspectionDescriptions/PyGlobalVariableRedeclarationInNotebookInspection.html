<h3>Notebook 中的全域變數重新宣告</h3>
<p>
  此檢查會檢測在同一 Jupyter Notebook 中重新宣告全域變數的情況。
  重新定義全域變數可能會導致意想不到的結果或 Bug，特別是在以任意順序執行單元時。
</p>
<p>
  為了降低噪點，對公共迴圈變數（例如，<code>i</code>、<code>j</code>、<code>k</code> 等）的重新定義會被忽略。
  不過，對列表、DataFrames 或字典等較大物件的重新定義會被標記為潛在問題。
</p>
<p>
  如果該重新定義是有意的，您可以使用提供的“對此語句禁止”快速修復來消除該特定情況下的警告。
</p>
<p>
  注意：此檢查僅適用於 Jupyter Notebook 檔案 (<code>.ipynb</code>)。
</p>
