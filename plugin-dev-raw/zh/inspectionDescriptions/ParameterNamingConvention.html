報告名稱太短、太長或不遵循指定正則表達式模式的方法參數。
<p>只能在編輯器中使用重新命名此類別參數的快速修復。</p>

<p><b>範例：</b></p>
<pre><code>
  void fooBar(int X) {}
</code></pre>
如果使用預設設定（其中參數名稱應以小寫字母開頭）啟用檢查，將報告此範例。

<!-- tooltip end -->
<p>
  使用<b>選項</b>部分中的欄位可以指定可接受的方法參數名稱的最小長度、最大長度以及正則表達式。 在長度欄位中指定 <b>0</b> 可以跳過相應檢查。
  正則表達式採用標準 <code>java.util.regex</code> 格式。
</p>
