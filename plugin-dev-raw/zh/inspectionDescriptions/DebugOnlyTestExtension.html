<ul>
  <li><code>com.intellij.ide.starter.junit5.RemoteDevRun</code></li>
  <li><code>com.intellij.ide.starter.extended.engine.junit5.UseInstaller</code></li>
</ul>
<p>
  這些擴展會更改測試引導 IDE 的方式（拆分模式/本地安裝程序），它們對於在開發者計算機上重現問題很有用，但應在推送更改之前將其移除。
</p>
