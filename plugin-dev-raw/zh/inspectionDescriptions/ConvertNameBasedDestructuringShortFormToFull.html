<body>
報告使用短形式的解構宣告，並建議將它們轉換為具有顯式屬性名稱的完整形式。 適用於資料類別。
<p><b>範例：</b></p>
<pre><code>
  data class Person(val firstName: String, val lastName: String)
  val (first, lastName) = person
</code></pre>
<p>該快速修復用於轉換為完整形式的解構：</p>
<pre><code>
  (val first = firstName, val lastName) = person
</code></pre>
<p>這種形式可以明確變數與屬性之間的映射關係。</p>
</body>
