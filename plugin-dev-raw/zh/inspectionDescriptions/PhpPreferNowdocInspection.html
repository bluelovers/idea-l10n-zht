報告不包含變數插值、表達式插值和轉義序列，因此可以寫成 nowdoc 的 heredoc 字串字面量。

<p>根據 PER-CS 3.0 §10，應盡可能使用 <code>nowdoc</code>。 不依賴於任何插值或轉義處理功能的 heredoc 與對應的 nowdoc 等效，而且讀起來更清晰。</p>

<p>
  請參閱 <a href="https://www.php-fig.org/per/coding-style/#10-heredoc-and-nowdoc">PER Coding Style 3.0 (php-fig.org)</a> 了解詳細資訊。
</p>
