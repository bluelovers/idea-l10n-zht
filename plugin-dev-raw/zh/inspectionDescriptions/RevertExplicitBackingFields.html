檢測顯式備用欄位。
<p>快速修復會將顯式備用欄位取代為 private 屬性和 getter。</p>
<p><b>範例：</b></p>
<pre><code>
  val items: Set&lt;Int&gt;
    field = mutableSetOf&lt;Int&gt;()
</code></pre>
<p>在套用快速修復後：</p>
<pre><code>
  private val _items = mutableSetOf&lt;Int&gt;()
  val items: Set&lt;Int&gt;
    get() = _items
</code></pre>
</body>
